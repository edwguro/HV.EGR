name: professional-portfolio

services:
  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 4000
      CORS_ORIGINS: http://localhost:3100
      DATABASE_URL: postgresql://portfolio:portfolio@postgres:5432/portfolio
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-replace-me}
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-replace-with-a-supported-model}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4100:4000'

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_USER: portfolio
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data

  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4100/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3100
    environment:
      API_INTERNAL_URL: http://api:4000/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:4100/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    depends_on:
      - api
    ports:
      - '3100:3000'

volumes:
  portfolio_postgres_data:
