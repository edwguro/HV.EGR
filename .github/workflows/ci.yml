name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_INTERNAL_URL: http://localhost:4100/api/v1
      API_PORT: 4100
      CORS_ORIGINS: http://localhost:3100
      DATABASE_URL: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio
      GITHUB_USERNAME: edwguro
      NEXT_PUBLIC_API_URL: http://localhost:4100/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NODE_ENV: test
      OPENAI_MODEL: replace-with-a-supported-model
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_USER: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Prepare database
        run: pnpm exec prisma migrate deploy && pnpm db:seed
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
